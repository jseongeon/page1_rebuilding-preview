<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 인사이트 06 대표 그림: EDMS·QMS·LMS·LIMS 네 시스템과 SOP 개정 흐름(QMS 변경관리 → EDMS 배포 → LMS 교육), LIMS 는 EDMS 와 연결 -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1C1916" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="52%" r="40%"><stop offset="0" stop-color="#F16123" stop-opacity=".18"/><stop offset="1" stop-color="#F16123" stop-opacity="0"/></radialGradient>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#F16123"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F16123"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#0A0908"/>
  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace" text-anchor="middle">
    <!-- 연결선 -->
    <g fill="none" stroke-width="2.5">
      <path d="M760 250 L640 195" stroke="url(#og)" marker-end="url(#ar)"/>
      <path d="M560 205 L455 355" stroke="url(#og)" marker-end="url(#ar)"/>
      <path d="M600 245 L600 300" stroke="#3A342F"/>
      <path d="M455 425 L560 495" stroke="#3A342F"/>
      <path d="M440 380 L760 300" stroke="#3A342F" stroke-dasharray="6 6"/>
    </g>
    <!-- 노드 -->
    <g stroke-width="2">
      <g transform="translate(600 175)"><rect x="-110" y="-46" width="220" height="92" fill="#0F0E0C" stroke="url(#og)"/><text y="-2" font-size="34" font-weight="700" fill="#F4F0EB">EDMS</text><text y="26" font-size="13" letter-spacing="2" fill="#ADA49B">DOCUMENTS</text></g>
      <g transform="translate(860 280)"><rect x="-110" y="-46" width="220" height="92" fill="#0F0E0C" stroke="#ADA49B"/><text y="-2" font-size="34" font-weight="700" fill="#F4F0EB">QMS</text><text y="26" font-size="13" letter-spacing="2" fill="#ADA49B">CHANGE · CAPA</text></g>
      <g transform="translate(340 380)"><rect x="-110" y="-46" width="220" height="92" fill="#0F0E0C" stroke="#ADA49B"/><text y="-2" font-size="34" font-weight="700" fill="#F4F0EB">LMS</text><text y="26" font-size="13" letter-spacing="2" fill="#ADA49B">TRAINING</text></g>
      <g transform="translate(600 530)"><rect x="-110" y="-46" width="220" height="92" fill="#0F0E0C" stroke="#ADA49B"/><text y="-2" font-size="34" font-weight="700" fill="#F4F0EB">LIMS</text><text y="26" font-size="13" letter-spacing="2" fill="#ADA49B">LAB DATA</text></g>
    </g>
    <!-- SOP 표식 -->
    <g transform="translate(600 300)"><rect x="-44" y="-20" width="88" height="40" fill="#0A0908" stroke="#5A524B" stroke-width="1.5"/><text y="7" font-size="18" letter-spacing="3" fill="#F7941D">SOP</text></g>
    <text x="1140" y="620" text-anchor="end" font-size="15" letter-spacing="3" fill="#8C837B">ONE CHANGE, FOUR RECORDS</text>
  </g>
</svg>
