    <circle cx="116" cy="150" r="7" fill="#F16123"/>
    <text x="132" y="155" font-size="14" letter-spacing="2" fill="#ADA49B">REC 00:42:15</text>
    <path d="M110 240v20M122 228v44M134 215v70M146 232v36M158 205v90M170 190v120M182 218v64M194 230v40M206 200v100M218 180v140M230 207v86M242 224v52M254 235v30M266 213v74M278 195v110M290 220v60M302 202v96M314 226v48M326 238v24M338 217v66M350 231v38M362 241v18M374 245v10" stroke="url(#og)" stroke-width="6" stroke-linecap="round"/>
    <text x="110" y="360" font-size="13" letter-spacing="3" fill="#8C837B">VOICE</text>
    <!-- 화살표 -->
    <g stroke="#F16123" stroke-width="2.5" marker-end="url(#ar)"><path d="M400 250H452"/><path d="M752 260H806"/></g>
