    <text x="470" y="160" font-size="13" letter-spacing="3" fill="#8C837B">TRANSCRIPT</text>
    <rect x="470" y="175" width="260" height="170" fill="#0F0E0C" stroke="#3A342F" stroke-width="1.5"/>
    <g fill="#2A2622"><rect x="492" y="201" width="200" height="8"/><rect x="492" y="225" width="160" height="8"/><rect x="492" y="273" width="120" height="8"/><rect x="492" y="297" width="175" height="8"/></g>
    <rect x="492" y="249" width="190" height="8" fill="url(#og)"/>
    <!-- 결정·담당·기한 카드 -->
    <g stroke-width="1.5">
      <g transform="translate(820 150)"><rect width="280" height="70" fill="#0F0E0C" stroke="url(#og)" stroke-width="2.5"/><text x="22" y="28" font-size="13" letter-spacing="2" fill="#F7941D">DECISION</text><text x="22" y="54" font-size="20" font-weight="700" fill="#F4F0EB">SCOPE FIXED</text></g>
      <g transform="translate(820 235)"><rect width="280" height="70" fill="#0F0E0C" stroke="#3A342F"/><text x="22" y="28" font-size="13" letter-spacing="2" fill="#8C837B">OWNER</text><text x="22" y="54" font-size="20" font-weight="700" fill="#F4F0EB">TEAM LEAD</text></g>
      <g transform="translate(820 320)"><rect width="280" height="70" fill="#0F0E0C" stroke="#3A342F"/><text x="22" y="28" font-size="13" letter-spacing="2" fill="#8C837B">DUE</text><text x="22" y="54" font-size="20" font-weight="700" fill="#F4F0EB">2026-10-17</text></g>
    </g>
    <text x="100" y="560" font-size="40" font-weight="700" letter-spacing="1" fill="#F4F0EB">VOICE TO DECISIONS</text>
    <text x="100" y="600" font-size="16" letter-spacing="3" fill="#8C837B">RECORD · TRANSCRIBE · ASSIGN</text>
    <rect x="100" y="622" width="120" height="3" fill="url(#og)"/>
  </g>
</svg>
