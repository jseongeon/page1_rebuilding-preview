<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 인사이트 04 대표 그림: V모델(URS·FS·DS → 구축 → IQ·OQ·PQ)과 GAMP 5 카테고리 1·3·4·5 -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1C1916" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="85%" r="50%"><stop offset="0" stop-color="#F16123" stop-opacity=".2"/><stop offset="1" stop-color="#F16123" stop-opacity="0"/></radialGradient>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#F16123"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#0A0908"/>
  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace" text-anchor="middle">
    <!-- V 선 -->
    <polyline points="250,160 400,290 520,420 600,500 680,420 800,290 950,160" fill="none" stroke="#3A342F" stroke-width="3"/>
    <polyline points="600,500 680,420 800,290 950,160" fill="none" stroke="url(#og)" stroke-width="3"/>
    <!-- 대응 점선 -->
    <g stroke="#5A524B" stroke-width="1.5" stroke-dasharray="6 6"><line x1="320" y1="160" x2="880" y2="160"/><line x1="470" y1="290" x2="730" y2="290"/><line x1="590" y1="420" x2="610" y2="420"/></g>
    <!-- 왼쪽: 명세 -->
    <g fill="#0F0E0C" stroke="#ADA49B" stroke-width="1.5"><rect x="180" y="134" width="140" height="52"/><rect x="330" y="264" width="140" height="52"/><rect x="450" y="394" width="140" height="52"/></g>
    <g font-size="22" font-weight="700" fill="#F4F0EB"><text x="250" y="168">URS</text><text x="400" y="298">FS</text><text x="520" y="428">DS</text></g>
    <!-- 오른쪽: 검증 -->
    <g fill="#0F0E0C" stroke="url(#og)" stroke-width="2"><rect x="880" y="134" width="140" height="52"/><rect x="730" y="264" width="140" height="52"/><rect x="610" y="394" width="140" height="52"/></g>
    <g font-size="22" font-weight="700" fill="#F4F0EB"><text x="950" y="168">PQ</text><text x="800" y="298">OQ</text><text x="680" y="428">IQ</text></g>
    <!-- 바닥 -->
    <rect x="530" y="482" width="140" height="44" fill="#151311" stroke="#3A342F" stroke-width="1.5"/>
    <text x="600" y="511" font-size="16" letter-spacing="3" fill="#ADA49B">BUILD</text>
    <g font-size="13" letter-spacing="2" fill="#8C837B"><text x="250" y="212">REQUIREMENTS</text><text x="950" y="212">PERFORMANCE</text></g>
    <!-- 카테고리 칩 -->
    <g font-size="15" letter-spacing="2">
      <text x="350" y="616" fill="#8C837B" text-anchor="end">GAMP 5 CATEGORY</text>
      <g fill="none" stroke="#3A342F" stroke-width="1.5"><rect x="380" y="590" width="64" height="38"/><rect x="460" y="590" width="64" height="38"/><rect x="540" y="590" width="64" height="38"/></g>
      <rect x="620" y="590" width="64" height="38" fill="none" stroke="url(#og)" stroke-width="2"/>
      <g font-size="20" font-weight="700" fill="#F4F0EB"><text x="412" y="616">1</text><text x="492" y="616">3</text><text x="572" y="616">4</text><text x="652" y="616">5</text></g>
      <text x="710" y="616" fill="#8C837B" text-anchor="start">MORE CUSTOM, MORE TESTING</text>
    </g>
  </g>
</svg>
