<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 인사이트 03 대표 그림: 계산 열이 잠긴 시험 계산 시트 + 수식 줄 + 검증 표시 -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1C1916" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="80%" cy="75%" r="50%"><stop offset="0" stop-color="#F16123" stop-opacity=".2"/><stop offset="1" stop-color="#F16123" stop-opacity="0"/></radialGradient>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#F16123"/></linearGradient>
    <g id="lock"><rect x="-8" y="-2" width="16" height="12" fill="none" stroke="#F7941D" stroke-width="2"/><path d="M-5 -2v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#F7941D" stroke-width="2"/></g>
  </defs>
  <rect width="1200" height="675" fill="#0A0908"/>
  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace">
    <!-- 수식 줄 -->
    <rect x="200" y="120" width="800" height="52" fill="#0F0E0C" stroke="#3A342F" stroke-width="1.5"/>
    <text x="222" y="153" font-size="18" font-style="italic" fill="#8C837B">fx</text>
    <line x1="262" y1="132" x2="262" y2="160" stroke="#3A342F"/>
    <text x="282" y="154" font-size="22" fill="#F4F0EB">=ROUND(AVERAGE(B2:C2),2)</text>
    <!-- 시트 -->
    <g transform="translate(200 196)">
      <rect width="800" height="370" fill="#0F0E0C" stroke="#3A342F" stroke-width="1.5"/>
      <rect width="800" height="46" fill="#151311"/>
      <g stroke="#2A2622" stroke-width="1"><line x1="70" y1="0" x2="70" y2="370"/><line x1="250" y1="0" x2="250" y2="370"/><line x1="410" y1="0" x2="410" y2="370"/><line x1="570" y1="0" x2="570" y2="370"/>
        <line x1="0" y1="46" x2="800" y2="46"/><line x1="0" y1="110" x2="800" y2="110"/><line x1="0" y1="174" x2="800" y2="174"/><line x1="0" y1="238" x2="800" y2="238"/><line x1="0" y1="302" x2="800" y2="302"/></g>
      <g font-size="16" letter-spacing="2" fill="#8C837B" text-anchor="middle"><text x="160" y="30">A</text><text x="330" y="30">B</text><text x="490" y="30">C</text><text x="685" y="30">D · RESULT</text>
        <text x="35" y="84">1</text><text x="35" y="148">2</text><text x="35" y="212">3</text><text x="35" y="276">4</text><text x="35" y="340">5</text></g>
      <g font-size="20" fill="#ADA49B"><text x="96" y="84">SAMPLE</text><text x="276" y="84">n1</text><text x="436" y="84">n2</text>
        <text x="96" y="148">LOT-031</text><text x="276" y="148">99.82</text><text x="436" y="148">100.11</text>
        <text x="96" y="212">LOT-032</text><text x="276" y="212">99.47</text><text x="436" y="212">99.90</text>
        <text x="96" y="276">LOT-033</text><text x="276" y="276">100.25</text><text x="436" y="276">99.68</text>
        <text x="96" y="340">LOT-034</text><text x="276" y="340">99.93</text><text x="436" y="340">100.02</text></g>
      <!-- 잠긴 계산 열 -->
      <rect x="570" y="110" width="230" height="260" fill="#F16123" fill-opacity=".07"/>
      <rect x="570" y="46" width="230" height="324" fill="none" stroke="url(#og)" stroke-width="3"/>
      <g font-size="22" font-weight="700" fill="#F4F0EB"><text x="596" y="148">99.97</text><text x="596" y="212">99.69</text><text x="596" y="276">99.97</text><text x="596" y="340">99.98</text></g>
      <use href="#lock" x="768" y="140"/><use href="#lock" x="768" y="204"/><use href="#lock" x="768" y="268"/><use href="#lock" x="768" y="332"/>
    </g>
    <!-- 검증 표시 -->
    <g transform="translate(1020 600)">
      <rect x="-180" y="-34" width="180" height="48" fill="#0A0908" stroke="url(#og)" stroke-width="2"/>
      <path d="M-160 -10l10 10 18 -20" fill="none" stroke="#F7941D" stroke-width="3"/>
      <text x="-118" y="-2" font-size="18" letter-spacing="3" fill="#F4F0EB">VERIFIED</text>
    </g>
  </g>
</svg>
