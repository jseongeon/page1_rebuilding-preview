<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 인사이트 12 대표 그림: 흩어진 개인 대화방 6개가 잠긴 업무 채널 하나로 모인다. 글자는 영문 모노만 -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1C1916" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="85%" cy="20%" r="50%"><stop offset="0" stop-color="#F16123" stop-opacity=".2"/><stop offset="1" stop-color="#F16123" stop-opacity="0"/></radialGradient>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#F16123"/></linearGradient>
    <g id="room"><rect width="160" height="72" rx="12" fill="#0F0E0C" stroke="#3A342F" stroke-width="1.5"/><circle cx="24" cy="24" r="8" fill="#2A2622"/><circle cx="40" cy="24" r="8" fill="#3A342F"/><rect x="18" y="44" width="110" height="7" fill="#2A2622"/></g>
  </defs>
  <rect width="1200" height="675" fill="#0A0908"/>
  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace">
    <!-- 모이는 선 -->
    <g fill="none" stroke="#3A342F" stroke-width="1.5" stroke-dasharray="4 6"><path d="M250 120Q520 140 640 300"/><path d="M455 95Q560 180 640 300"/><path d="M280 265Q500 270 640 300"/><path d="M480 245Q580 280 640 300"/><path d="M260 410Q500 360 640 300"/><path d="M460 390Q560 330 640 300"/></g>
    <path d="M640 300H706" stroke="#F7941D" stroke-width="3"/><path d="M698 292L710 300L698 308" fill="none" stroke="#F16123" stroke-width="3"/>
    <!-- 흩어진 개인 대화방 -->
    <use href="#room" transform="translate(90 85) rotate(-6)"/>
    <use href="#room" transform="translate(295 60) rotate(5)"/>
    <use href="#room" transform="translate(120 228) rotate(3)"/>
    <use href="#room" transform="translate(320 210) rotate(-5)"/>
    <use href="#room" transform="translate(100 375) rotate(-3)"/>
    <use href="#room" transform="translate(300 355) rotate(6)"/>
    <!-- 잠긴 업무 채널 -->
    <rect x="720" y="120" width="380" height="400" rx="18" fill="#0F0E0C" stroke="url(#og)" stroke-width="2.5"/>
    <g fill="#15130F"><rect x="745" y="170" width="330" height="62"/><rect x="745" y="246" width="330" height="62"/><rect x="745" y="322" width="330" height="62"/><rect x="745" y="398" width="330" height="62"/></g>
    <g font-size="14" letter-spacing="2" fill="#ADA49B"><text x="765" y="198"># HANDOVER</text><text x="765" y="274">NOTICE</text><text x="765" y="350">APPROVAL</text><text x="765" y="426">SHIFT ROSTER</text></g>
    <g fill="#2A2622"><rect x="765" y="212" width="190" height="7"/><rect x="765" y="288" width="150" height="7"/><rect x="765" y="364" width="170" height="7"/><rect x="765" y="440" width="130" height="7"/></g>
    <g transform="translate(910 82)"><path d="M-17 38V20a17 17 0 0 1 34 0V38" fill="none" stroke="url(#og)" stroke-width="5"/><rect x="-28" y="34" width="56" height="44" rx="7" fill="url(#og)"/><circle cy="54" r="5" fill="#0A0908"/><rect x="-2" y="56" width="4" height="12" fill="#0A0908"/></g>
    <text x="80" y="570" font-size="40" font-weight="700" letter-spacing="1" fill="#F4F0EB">ONE LOCKED CHANNEL</text>
    <text x="80" y="608" font-size="16" letter-spacing="3" fill="#8C837B">INSTEAD OF SCATTERED PERSONAL CHATS</text>
    <rect x="80" y="630" width="120" height="3" fill="url(#og)"/>
  </g>
</svg>
