<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 인사이트 07 대표 그림: 그룹웨어 묶음(결재·게시판·조직도·근태)과 협업툴 묶음(메신저·메일·캘린더·드라이브)이 계정 하나로 모인다 -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1C1916" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="85%" cy="20%" r="50%"><stop offset="0" stop-color="#F16123" stop-opacity=".2"/><stop offset="1" stop-color="#F16123" stop-opacity="0"/></radialGradient>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#F16123"/></linearGradient>
    <rect id="t" width="170" height="54" fill="#0F0E0C" stroke="#3A342F" stroke-width="1.5"/>
  </defs>
  <rect width="1200" height="675" fill="#0A0908"/>
  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace">
    <!-- 연결선 -->
    <g fill="none" stroke="url(#og)" stroke-width="2.5">
      <path d="M470 187C620 187 620 280 760 285"/>
      <path d="M470 417C620 417 620 330 760 325"/>
    </g>
    <!-- 그룹웨어 묶음 -->
    <text x="100" y="112" font-size="13" letter-spacing="3" fill="#8C837B">GROUPWARE</text>
    <g font-size="15" letter-spacing="2" fill="#ADA49B">
      <use href="#t" x="100" y="130"/><text x="122" y="163">APPROVAL</text>
      <use href="#t" x="290" y="130"/><text x="312" y="163">BOARD</text>
      <use href="#t" x="100" y="190"/><text x="122" y="223">ORG CHART</text>
      <use href="#t" x="290" y="190"/><text x="312" y="223">ATTENDANCE</text>
    </g>
    <!-- 협업툴 묶음 -->
    <text x="100" y="342" font-size="13" letter-spacing="3" fill="#8C837B">COLLABORATION</text>
    <g font-size="15" letter-spacing="2" fill="#ADA49B">
      <use href="#t" x="100" y="360"/><text x="122" y="393">MESSENGER</text>
      <use href="#t" x="290" y="360"/><text x="312" y="393">MAIL</text>
      <use href="#t" x="100" y="420"/><text x="122" y="453">CALENDAR</text>
      <use href="#t" x="290" y="420"/><text x="312" y="453">DRIVE</text>
    </g>
    <!-- 계정 하나 -->
    <g transform="translate(760 220)">
      <rect width="300" height="170" fill="#0F0E0C" stroke="url(#og)" stroke-width="2.5"/>
      <circle cx="58" cy="85" r="30" fill="none" stroke="#F7941D" stroke-width="2.5"/>
      <circle cx="58" cy="76" r="9" fill="#F7941D"/>
      <path d="M41 100a17 13 0 0 1 34 0" fill="#F7941D"/>
      <text x="110" y="82" font-size="30" font-weight="700" fill="#F4F0EB">1 ACCOUNT</text>
      <text x="110" y="110" font-size="13" letter-spacing="2" fill="#ADA49B">ONE ORG CHART</text>
    </g>
    <text x="100" y="560" font-size="40" font-weight="700" letter-spacing="1" fill="#F4F0EB">TWO TOOLS, ONE ACCOUNT</text>
    <text x="100" y="600" font-size="16" letter-spacing="3" fill="#8C837B">GROUPWARE + COLLABORATION</text>
    <rect x="100" y="622" width="120" height="3" fill="url(#og)"/>
  </g>
</svg>
