      <text x="28" y="104" font-size="42" font-weight="700" fill="#F4F0EB">ANNEX 11</text>
      <text x="28" y="134" font-size="13" letter-spacing="2" fill="#ADA49B">COMPUTERISED SYSTEMS</text>
      <g fill="#2A2622"><rect x="28" y="170" width="244" height="8"/><rect x="28" y="194" width="210" height="8"/><rect x="28" y="218" width="236" height="8"/><rect x="28" y="242" width="180" height="8"/><rect x="28" y="266" width="226" height="8"/><rect x="28" y="290" width="150" height="8"/></g>
      <rect x="28" y="326" width="120" height="30" fill="none" stroke="url(#og)" stroke-width="2"/>
      <text x="88" y="347" font-size="14" letter-spacing="3" text-anchor="middle" fill="#F7941D">REVISION</text>
    </g>
    <!-- 문서 2: Annex 22 (AI) -->
    <g transform="translate(610 150) rotate(3)">
      <rect width="300" height="380" fill="#0F0E0C" stroke="#3A342F" stroke-width="1.5"/>
      <text x="28" y="52" font-size="14" letter-spacing="3" fill="#8C837B">EUDRALEX VOL.4</text>
      <text x="28" y="104" font-size="42" font-weight="700" fill="#F4F0EB">ANNEX 22</text>
      <text x="28" y="134" font-size="13" letter-spacing="2" fill="#ADA49B">ARTIFICIAL INTELLIGENCE</text>
      <g stroke="#5A524B" stroke-width="1.5"><line x1="80" y1="200" x2="150" y2="170"/><line x1="80" y1="200" x2="150" y2="230"/><line x1="80" y1="260" x2="150" y2="230"/><line x1="80" y1="260" x2="150" y2="290"/><line x1="150" y1="170" x2="220" y2="230"/><line x1="150" y1="230" x2="220" y2="230"/><line x1="150" y1="290" x2="220" y2="230"/></g>
      <g fill="#0A0908" stroke="#ADA49B" stroke-width="2"><circle cx="80" cy="200" r="9"/><circle cx="80" cy="260" r="9"/><circle cx="150" cy="170" r="9"/><circle cx="150" cy="230" r="9"/><circle cx="150" cy="290" r="9"/></g>
