<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 인사이트 02 대표 그림: 개정 초안 문서 두 장(Annex 11 · 신설 Annex 22)과 일정 선. 2026 Q4 는 목표(TARGET)로만 표기 -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1C1916" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="22%" cy="70%" r="55%"><stop offset="0" stop-color="#F16123" stop-opacity=".2"/><stop offset="1" stop-color="#F16123" stop-opacity="0"/></radialGradient>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#F16123"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#0A0908"/>
  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace">
    <!-- 문서 1: Annex 11 -->
    <g transform="translate(300 120) rotate(-4)">
      <rect width="300" height="380" fill="#0F0E0C" stroke="#3A342F" stroke-width="1.5"/>
