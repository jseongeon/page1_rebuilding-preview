    <line x1="160" y1="600" x2="1040" y2="600" stroke="#3A342F" stroke-width="2"/>
    <line x1="160" y1="600" x2="740" y2="600" stroke="url(#og)" stroke-width="2"/>
    <g fill="#0A0908" stroke-width="2"><circle cx="160" cy="600" r="8" stroke="#ADA49B"/><circle cx="740" cy="600" r="8" stroke="#F16123"/><circle cx="1040" cy="600" r="8" stroke="#ADA49B" stroke-dasharray="3 3"/></g>
    <g font-size="15" letter-spacing="2" fill="#ADA49B" text-anchor="middle">
      <text x="160" y="636">2011 IN FORCE</text><text x="740" y="636" fill="#F4F0EB">2025 DRAFT</text><text x="1040" y="636">2026 Q4 TARGET</text>
